name: Deploy to Cloudflare

# ── Routing ────────────────────────────────────────────────────────────────
#   push ke `main`        → production (Worker: cms-captiveau)
#   push ke `development` → staging     (Worker: cms-captiveau-staging)
#   manual (workflow_dispatch) → pilih environment dari dropdown
#
# Resource target (D1/R2) diambil dari `env.production` / `env.staging` di
# wrangler.jsonc — lihat docs/deploy-staging-production.md untuk rincian.

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:
    inputs:
      environment:
        description: Environment tujuan
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: cms-captiveau-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  NODE_OPTIONS: --max-old-space-size=4096
  # Build-time placeholder — Payload config init requires a non-empty secret.
  # Non-NEXT_PUBLIC (read dynamically), so it is NOT baked into the bundle;
  # each Worker uses its own secret from `wrangler secret put` at runtime.
  PAYLOAD_SECRET: ignore

jobs:
  # ── Staging ───────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy staging (cms-captiveau-staging)
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/development' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Cloudflare auth (fail fast if secrets missing)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum di-set di GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID belum di-set di GitHub."
            exit 1
          fi
          npx wrangler whoami
          # R2 canary — opennext provisions the incremental-cache bucket via the
          # R2 REST API at deploy time; fail early if the token lacks R2 access.
          if ! npx wrangler r2 bucket list >/dev/null 2>&1; then
            echo "::error::CLOUDFLARE_API_TOKEN tidak punya permission R2. Tambahkan Account · R2 Storage · Edit pada token API Cloudflare."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations (staging D1)
        run: pnpm run deploy:database:staging
        # NOTE: lihat docs/deploy-staging-production.md — `payload migrate` via CLI
        # saat ini berjalan sebagai no-op terhadap DB remote; perubahan schema
        # harus diterapkan lewat `wrangler d1 execute --remote`.

      - name: Build OpenNext worker
        run: pnpm run build:cf

      - name: Deploy worker to staging
        run: npx opennextjs-cloudflare deploy --env staging

      - name: Smoke test
        run: |
          curl --fail -sS -o /dev/null -w "staging HTTP %{http_code}\n" \
            https://cms-captiveau-staging.mulaiplus.workers.dev/

  # ── Production ────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy production (cms-captiveau)
    if: >
      github.event_name == 'push' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Cloudflare auth (fail fast if secrets missing)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum di-set di GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID belum di-set di GitHub."
            exit 1
          fi
          npx wrangler whoami
          # R2 canary — opennext provisions the incremental-cache bucket via the
          # R2 REST API at deploy time; fail early if the token lacks R2 access.
          if ! npx wrangler r2 bucket list >/dev/null 2>&1; then
            echo "::error::CLOUDFLARE_API_TOKEN tidak punya permission R2. Tambahkan Account · R2 Storage · Edit pada token API Cloudflare."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations (production D1)
        run: pnpm run deploy:database

      - name: Build OpenNext worker
        run: pnpm run build:cf

      - name: Deploy worker to production
        run: npx opennextjs-cloudflare deploy

      - name: Smoke test
        run: |
          curl --fail -sS -o /dev/null -w "production HTTP %{http_code}\n" \
            https://cms-captiveau.mulaiplus.workers.dev/