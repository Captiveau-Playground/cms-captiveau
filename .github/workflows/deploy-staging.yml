name: Deploy staging

# ── Staging ───────────────────────────────────────────────────────────────
#   push ke `development` → Worker: cms-captiveau-staging
#   manual (workflow_dispatch) → deploy staging
#   Setelah sukses: git tag `staging-<timestamp>` di-push otomatis.
# Resource target (D1/R2) diambil dari `env.staging` di wrangler.jsonc.

on:
  push:
    branches:
      - development
  workflow_dispatch:

concurrency:
  group: cms-captiveau-deploy-staging
  cancel-in-progress: false

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  NODE_OPTIONS: --max-old-space-size=4096
  # Build-time placeholder — non-NEXT_PUBLIC (dibaca dinamis), jadi tidak
  # ter-bake ke bundle; runtime memakai secret per-worker.
  PAYLOAD_SECRET: ignore

jobs:
  deploy-staging:
    name: Deploy staging (cms-captiveau-staging)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Cloudflare auth (fail fast if secrets/permissions missing)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum di-set di GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID belum di-set di GitHub."
            exit 1
          fi
          npx wrangler whoami
          if ! npx wrangler r2 bucket list >/dev/null 2>&1; then
            echo "::error::CLOUDFLARE_API_TOKEN tidak punya permission R2. Tambahkan Account · R2 Storage · Edit pada token API Cloudflare."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations (staging D1)
        run: pnpm run deploy:database:staging
        # NOTE: lihat docs/deploy-staging-production.md — `payload migrate` via CLI
        # saat ini no-op terhadap DB remote; perubahan schema lewat `wrangler d1 execute --remote`.

      - name: Build OpenNext worker
        run: pnpm run build:cf

      - name: Deploy worker to staging
        run: npx opennextjs-cloudflare deploy --env staging

      - name: Smoke test
        run: |
          curl --fail -sS -o /dev/null -w "staging HTTP %{http_code}\n" \
            https://cms-captiveau-staging.mulaiplus.workers.dev/

      - name: Create and push deploy tag
        if: success()
        run: |
          TAG="staging-$(date +'%Y%m%d-%H%M%S')"
          git config user.name "ci-bot"
          git config user.email "ci@captiveau.id"
          git tag -a "$TAG" -m "Deploy staging ${GITHUB_SHA::10} ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          git push origin "$TAG"
          echo "Tag pushed: $TAG"