name: Deploy production

# ── Production ────────────────────────────────────────────────────────────
#   push ke `main` → Worker: cms-captiveau
#   manual (workflow_dispatch) → deploy production
#   Setelah sukses: git tag `prod-<timestamp>` di-push otomatis.
# Resource target (D1/R2) diambil dari `env.production` di wrangler.jsonc.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cms-captiveau-deploy-production
  cancel-in-progress: false

permissions:
  contents: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  NODE_OPTIONS: --max-old-space-size=4096
  # Build-time placeholder — non-NEXT_PUBLIC (dibaca dinamis), jadi tidak
  # ter-bake ke bundle; runtime memakai secret per-worker.
  PAYLOAD_SECRET: ignore

jobs:
  deploy-production:
    name: Deploy production (cms-captiveau)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify Cloudflare auth (fail fast if secrets/permissions missing)
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN belum di-set di GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secret CLOUDFLARE_ACCOUNT_ID belum di-set di GitHub."
            exit 1
          fi
          npx wrangler whoami
          if ! npx wrangler r2 bucket list >/dev/null 2>&1; then
            echo "::error::CLOUDFLARE_API_TOKEN tidak punya permission R2. Tambahkan Account · R2 Storage · Edit pada token API Cloudflare."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations (production D1)
        run: pnpm run deploy:database
        # NOTE: lihat docs/deploy-staging-production.md — `payload migrate` via CLI
        # saat ini no-op terhadap DB remote; perubahan schema lewat `wrangler d1 execute --remote`.

      - name: Build OpenNext worker
        run: pnpm run build:cf

      - name: Deploy worker to production
        run: npx opennextjs-cloudflare deploy

      - name: Smoke test
        run: |
          curl --fail -sS -o /dev/null -w "production HTTP %{http_code}\n" \
            https://cms-captiveau.mulaiplus.workers.dev/

      - name: Create and push deploy tag
        if: success()
        run: |
          TAG="prod-$(date +'%Y%m%d-%H%M%S')"
          git config user.name "ci-bot"
          git config user.email "ci@captiveau.id"
          git tag -a "$TAG" -m "Deploy production ${GITHUB_SHA::10} ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
          git push origin "$TAG"
          echo "Tag pushed: $TAG"