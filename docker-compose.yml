version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: captiveau-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: captiveau
      POSTGRES_PASSWORD: captiveau123
      POSTGRES_DB: captiveau
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captiveau"]
      interval: 5s
      timeout: 5s
      retries: 5

  payload:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: captiveau-payload
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URI: postgres://captiveau:captiveau123@postgres:5432/captiveau
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-captiveau-payload-secret-key-change-in-production}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:4000}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:4000}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - payload-media:/app/media
      - ./public:/app/public

volumes:
  postgres-data:
  payload-media:
