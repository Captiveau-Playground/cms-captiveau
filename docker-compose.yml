services:
  postgres:
    image: postgres:16-alpine
    container_name: captiveau-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: captiveau
      POSTGRES_PASSWORD: captiveau123
      POSTGRES_DB: captiveau
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U captiveau"]
      interval: 5s
      timeout: 5s
      retries: 5

  payload-dev:
    image: cms-captiveau-payload-dev:latest
    container_name: captiveau-payload-dev
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URI: postgres://captiveau:captiveau123@postgres:5432/captiveau
      PAYLOAD_SECRET: captiveau-dev-secret
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:4000
      NEXT_PUBLIC_SERVER_URL: http://localhost:4000
      NODE_ENV: development
      CI: 'true'
      COREPACK_ENABLE_STRICT: '0'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
