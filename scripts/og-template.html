<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Satoshi';
    src: url(data:font/woff2;base64,{{FONT}}) format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #ffffff; }
  body {
    font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    color: #0f172a;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Kartu — rounded-xl + border subtle + soft shadow, sesuai Clean Studio */
  .card {
    width: 1120px;
    height: 550px;
    border-radius: 28px;
    border: 1px solid #e2e8f0;
    background: #ffffff;
    box-shadow: 0 24px 70px -28px rgba(15, 23, 42, 0.18);
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Eyebrow — label kecil uppercase + orange dot (aksen) */
  .top { display: flex; align-items: center; gap: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 9999px; background: #ff6600; }
  .eyebrow {
    font-size: 15px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: #64748b;
  }
  .brand-tag {
    margin-left: auto;
    font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: #2563eb;
  }

  .main { flex: 1; display: flex; align-items: center; gap: 56px; min-height: 0; }

  .text { flex: 1; min-width: 0; }
  h1 {
    font-size: 108px; font-weight: 800; letter-spacing: -0.045em; line-height: 0.96;
    color: #0f172a;
  }
  .accent-bar {
    margin-top: 20px; width: 72px; height: 4px; border-radius: 9999px; background: #2563eb;
  }
  .tagline {
    margin-top: 26px; font-size: 24px; font-weight: 500; line-height: 1.45;
    color: #64748b; letter-spacing: -0.01em;
  }

  /* Logo asli di panel muted rounded-xl */
  .mark-panel {
    width: 260px; height: 260px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    border-radius: 24px;
  }
  .mark-panel img { width: 180px; height: 180px; object-fit: contain; }

  .foot {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid #e2e8f0; padding-top: 22px;
  }
  .foot .mono {
    font-size: 14px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
    color: #64748b;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: #2563eb; color: #ffffff;
    font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
    padding: 12px 22px; border-radius: 9999px;
  }
  .pill::after { content: "→"; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="dot"></span>
      <span class="eyebrow">Creative Tech Studio</span>
      <span class="brand-tag">captiveau.id</span>
    </div>

    <div class="main">
      <div class="text">
        <h1>Captiveau</h1>
        <div class="accent-bar"></div>
        <p class="tagline">Digital product design &amp; development — dari ide hingga produk nyata.</p>
      </div>
      <div class="mark-panel">
        <img src="data:image/png;base64,{{LOGO}}" alt="Logo Captiveau" />
      </div>
    </div>

    <div class="foot">
      <span class="mono">Jakarta, Indonesia</span>
      <span class="mono">Software House</span>
      <span class="pill">Mulai dengan kami</span>
    </div>
  </div>
</body>
</html>
