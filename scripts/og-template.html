<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto,
      "Helvetica Neue", Arial, sans-serif;
    background: #0b1020;
    color: #f8fafc;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  /* subtle grid */
  .grid-lines {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 90% 90% at 70% 20%, black 30%, transparent 75%);
  }
  /* glows */
  .glow-orange { position: absolute; width: 560px; height: 560px; border-radius: 9999px; right: -140px; top: -180px; background: radial-gradient(circle, rgba(255,102,0,0.32), transparent 65%); }
  .glow-blue { position: absolute; width: 560px; height: 560px; border-radius: 9999px; left: -160px; bottom: -220px; background: radial-gradient(circle, rgba(37,99,235,0.28), transparent 65%); }

  /* corner brackets */
  .corner { position: absolute; width: 64px; height: 64px; border: 3px solid #ff6600; opacity: .9; }
  .c-tl { top: 34px; left: 34px; border-right: 0; border-bottom: 0; }
  .c-br { bottom: 34px; right: 34px; border-left: 0; border-top: 0; }

  .content { position: absolute; inset: 0; padding: 90px 110px; display: flex; flex-direction: column; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 15px; letter-spacing: .34em; text-transform: uppercase;
    color: #ff6600;
  }
  .eyebrow::before { content: ""; width: 34px; height: 2px; background: #ff6600; }

  .wordmark {
    margin-top: 34px;
    font-size: 128px; font-weight: 800; letter-spacing: -0.045em; line-height: .95;
    color: #ffffff;
  }
  .wordmark em { font-style: normal; color: #ff6600; }

  .rule { margin-top: 30px; width: 320px; height: 1px; background: rgba(255,255,255,0.18); }

  .tagline { margin-top: 24px; font-size: 26px; font-weight: 500; color: rgba(248,250,252,0.78); letter-spacing: -0.01em; }

  .meta {
    margin-top: auto;
    display: flex; align-items: center; justify-content: space-between;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px; letter-spacing: .22em; text-transform: uppercase;
    color: rgba(248,250,252,0.55);
  }
  .meta .dot { width: 10px; height: 10px; border-radius: 9999px; background: #ff6600; display: inline-block; margin-right: 10px; }

  /* right mark */
  .mark { position: absolute; right: 110px; top: 168px; width: 128px; height: 128px; display: flex; align-items: center; justify-content: center; }
  .mark .ring { position: absolute; inset: 0; border: 3px solid rgba(255,255,255,0.16); rotate: 45deg; }
  .mark .core { width: 44px; height: 44px; background: #ff6600; rotate: 45deg; }
</style>
</head>
<body>
  <div class="grid-lines"></div>
  <div class="glow-orange"></div>
  <div class="glow-blue"></div>
  <div class="corner c-tl"></div>
  <div class="corner c-br"></div>

  <div class="content">
    <div class="eyebrow">Creative Tech Studio</div>
    <div class="wordmark">captiv<em>eau</em>.</div>
    <div class="rule"></div>
    <div class="tagline">Digital product design &amp; development — dari ide hingga produk nyata.</div>
    <div class="meta">
      <span><span class="dot"></span>captiveau.id</span>
      <span>Jakarta, Indonesia</span>
    </div>
  </div>

  <div class="mark">
    <div class="ring"></div>
    <div class="core"></div>
  </div>
</body>
</html>
